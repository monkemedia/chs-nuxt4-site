# Pages CMS (https://pagescms.org): lets CHS staff add and edit Recent work in the browser.
# Each job is saved as app/data/jobs/<slug>.json and committed to GitHub; the host then
# rebuilds the site. Validation lives in app/data/jobs-schema.ts; keep the two in step.
media:
  input: public/images/jobs
  output: /images/jobs
  extensions: [jpg, jpeg, png, webp]

content:
  - name: jobs
    label: Recent work
    type: collection
    path: app/data/jobs
    format: json
    # The file name (from the English title) becomes the job's web address: /work/<file name>.
    filename: "{primary}.json"
    view:
      fields: [en.title, date, published]
      primary: en.title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: published
        label: Published
        type: boolean
        default: false
        description: Tick when the job is ready to go on the site. Until then, it only shows on the preview site.
      - name: date
        label: Date finished
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: service
        label: Service
        type: select
        required: true
        options:
          values:
            - { value: hydraulic-hoses, label: Hydraulic Hoses }
            - { value: ram-repairs, label: Ram Repairs }
            - { value: hydraulic-system-repairs, label: System Repairs }
            - { value: on-site-hydraulic-service, label: On-site Service }
      - name: image
        label: Photo
        type: image
        description: Your own photo of this job, landscape, at least 800 × 500. No stock photos. Optional; without one, cards show the service's photo.
      - name: en
        label: English
        type: object
        fields:
          - name: title
            label: Title
            type: string
            required: true
            description: What was done, to what, e.g. "Boom ram rebuilt for a JCB 3CX". Aim for under 45 characters.
          - name: summary
            label: Summary
            type: text
            required: true
            description: One or two sentences for the card and Google (under 160 characters).
          - name: machine
            label: Machine
            type: string
          - name: location
            label: Location
            type: string
            description: Town or area only. Name the customer only with their permission.
          - name: problem
            label: The problem
            type: text
            required: true
          - name: work
            label: What we did
            type: string
            list: true
            required: true
            description: One step per line.
          - name: result
            label: The result
            type: text
            required: true
          - name: imageAlt
            label: Photo description
            type: string
            description: What the photo shows, for people who can't see it.
      - name: cy
        label: Welsh (Cymraeg)
        type: object
        description: Optional. Without it, the Welsh site shows the English with a note that it's only available in English.
        fields:
          - name: title
            label: Title
            type: string
            description: What was done, to what, e.g. "Boom ram rebuilt for a JCB 3CX". Aim for under 45 characters.
          - name: summary
            label: Summary
            type: text
            description: One or two sentences for the card and Google (under 160 characters).
          - name: machine
            label: Machine
            type: string
          - name: location
            label: Location
            type: string
            description: Town or area only. Name the customer only with their permission.
          - name: problem
            label: The problem
            type: text
          - name: work
            label: What we did
            type: string
            list: true
            description: One step per line.
          - name: result
            label: The result
            type: text
          - name: imageAlt
            label: Photo description
            type: string
            description: What the photo shows, for people who can't see it.

  - name: reviews
    label: Reviews
    type: collection
    path: app/data/reviews
    format: json
    # Only REAL reviews, copied exactly. Fake or edited reviews breach UK consumer law (CMA)
    # and Google's policies. Checked at build time by modules/reviews.ts.
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      fields: [author, source, date]
      primary: author
      default:
        sort: date
        order: desc
    fields:
      - name: source
        label: Type
        type: select
        required: true
        default: google
        options:
          values:
            - { value: google, label: Google review }
            - { value: testimonial, label: Testimonial (sent to us directly) }
      - name: author
        label: Name
        type: string
        required: true
        description: Exactly as shown on Google. For testimonials, only with the customer's permission.
      - name: company
        label: Company or role
        type: string
        description: Testimonials only, e.g. "Site manager, Jones Groundworks". Leave empty for Google reviews.
      - name: rating
        label: Stars (1–5)
        type: number
        options:
          min: 1
          max: 5
        description: The reviewer's star rating on Google. Leave empty for testimonials without one.
      - name: text
        label: Review
        type: text
        required: true
        description: Copy it word for word. Never edit, shorten or tidy up a review.
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: The date on the review. Shown on the site as month and year.

  - name: google-rating
    label: Google rating
    type: file
    path: app/data/google-rating.json
    format: json
    fields:
      - name: rating
        label: Overall rating
        type: number
        options:
          min: 1
          max: 5
          step: 0.1
        description: As shown on the Google Business Profile, e.g. 4.8. Update when it changes.
      - name: count
        label: Number of reviews
        type: number
        options:
          min: 1
        description: Leave both empty to hide the rating summary.
